<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 수학 과제 풀기</title>
    <link rel="stylesheet" href="puzzle.css">
    <link rel="stylesheet" href="math.css?v=8">
</head>
<body>
    <h1 class="page-title">🧮 수학 과제 풀기</h1>
    <p class="page-subtitle">선생님이 보내준 문제를 풀어보자! 다 풀면 결과가 짠~ 하고 나와요 🌈</p>

    <!-- ── 과제 링크가 아닐 때 ── -->
    <div id="noAssign" class="screen hidden">
        <div class="controls" style="text-align:center;">
            <p class="level-hint" style="font-size:1.1rem;">
                앗! 이 페이지는 <b>선생님이 보내준 과제 링크</b>로 들어와야 해요 🧩<br>
                받은 링크를 콕 눌러서 다시 들어와 줄래요? ✨
            </p>
        </div>
        <p class="page-subtitle home-link"><a href="index.html">🏠 놀이터 입구로 돌아가기</a></p>
    </div>

    <!-- ── 이름 입력 (과제일 때만 보임) ── -->
    <div id="nameRow" class="screen hidden">
        <div class="controls">
            <div class="row">
                <span class="control-label">이름</span>
                <input type="text" id="nameInput" placeholder="이름을 적어요 (선생님이 누구 결과인지 알 수 있어요)">
            </div>
        </div>
    </div>

    <!-- ── 문제 풀이 화면 ── -->
    <div id="quiz" class="screen hidden">
        <span class="progress" id="progress">0 / 0</span>
        <div id="question" style="width:100%;display:flex;justify-content:center;"></div>
    </div>

    <!-- ── 결과 화면 ── -->
    <div id="report" class="screen hidden">
        <div id="reviewBanner" class="review-banner hidden">
            🔁 이 과제는 전에 풀었어요! 지난 결과를 보여줄게요 (복습만 가능해요) ✨
        </div>
        <div class="report-body" id="reportBody"></div>
        <div class="controls" style="margin-top:16px;">
            <p class="level-hint" style="text-align:center;">
                아래 결과를 <b>통째로 복사해서</b> 선생님께 메신저로 보내주면 끝! 📨
            </p>
            <textarea id="resultBox" class="result-box hidden" readonly rows="9"></textarea>
            <div class="row" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                <button type="button" id="copyBtn">결과 보내기 📋</button>
            </div>
        </div>
        <p class="page-subtitle home-link"><a href="index.html">🏠 놀이터 입구로 돌아가기</a></p>
    </div>

    <div id="message" class="message"></div>

    <script src="question-bank.js?v=1"></script>
    <script src="question-template.js?v=3"></script>
    <script src="question-figures.js?v=8"></script>
    <script src="question-renderer.js?v=3"></script>
    <script src="assignment-core.js?v=1"></script>
    <script src="math-assignment.js?v=2"></script>
    <script>
        AssignmentQuiz.init({
            noAssignEl:    document.getElementById('noAssign'),
            nameInput:     document.getElementById('nameInput'),
            nameRowEl:     document.getElementById('nameRow'),
            quizEl:        document.getElementById('quiz'),
            progressEl:    document.getElementById('progress'),
            questionEl:    document.getElementById('question'),
            reportEl:      document.getElementById('report'),
            reportBodyEl:  document.getElementById('reportBody'),
            reviewBannerEl:document.getElementById('reviewBanner'),
            copyBtn:       document.getElementById('copyBtn'),
            resultBoxEl:   document.getElementById('resultBox'),
            messageEl:     document.getElementById('message'),
        });
    </script>
</body>
</html>
