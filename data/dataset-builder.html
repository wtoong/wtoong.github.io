<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 데이터셋 빌더</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f5; padding: 24px; }
    h1 { font-size: 1.3rem; margin-bottom: 20px; }
    .container { max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .card { background: #fff; border-radius: 10px; padding: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .card h2 { font-size: 1rem; margin-bottom: 14px; color: #333; }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 4px; margin-top: 12px; }
    label:first-of-type { margin-top: 0; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
    textarea { height: 80px; resize: vertical; }
    button { margin-top: 14px; padding: 9px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-add { background: #3b82f6; color: #fff; width: 100%; }
    .btn-add:hover { background: #2563eb; }
    .btn-copy { background: #10b981; color: #fff; width: 100%; margin-top: 8px; }
    .btn-copy:hover { background: #059669; }
    .btn-clear { background: #ef4444; color: #fff; width: 100%; margin-top: 4px; }
    .btn-clear:hover { background: #dc2626; }
    .preview-img { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; margin-top: 10px; display: none; background: #f0f0f0; }
    #jsonOutput { width: 100%; height: 340px; font-family: monospace; font-size: 0.78rem; resize: vertical; }
    .count { font-size: 0.82rem; color: #888; margin-bottom: 8px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 0.88rem; display: none; }
    .import-area { margin-top: 12px; }
    .full-width { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <h1>📚 교과 이미지 데이터셋 빌더</h1>
  <div class="container">

    <div class="card">
      <h2>이미지 추가</h2>

      <label>이미지 URL *</label>
      <input type="url" id="imgUrl" placeholder="https://portal.nrich.go.kr/..." oninput="previewImg()">
      <img id="imgPreview" class="preview-img">

      <label>제목 *</label>
      <input type="text" id="imgTitle" placeholder="예: 덧셈과 뺄셈 그림">

      <label>학년</label>
      <select id="imgGrade">
        <option value="0">공통</option>
        <option value="1">1학년</option>
        <option value="2">2학년</option>
        <option value="3">3학년</option>
        <option value="4">4학년</option>
        <option value="5">5학년</option>
        <option value="6">6학년</option>
      </select>

      <label>과목</label>
      <select id="imgSubject">
        <option value="수학">수학</option>
        <option value="국어">국어</option>
        <option value="과학">과학</option>
        <option value="사회">사회</option>
        <option value="도덕">도덕</option>
        <option value="미술">미술</option>
        <option value="음악">음악</option>
        <option value="체육">체육</option>
        <option value="영어">영어</option>
        <option value="기타">기타</option>
      </select>

      <label>태그 (쉼표 구분)</label>
      <input type="text" id="imgTags" placeholder="덧셈, 수 세기, 1학기">

      <button class="btn-add" onclick="addEntry()">+ 목록에 추가</button>
    </div>

    <div class="card">
      <h2>JSON 출력</h2>
      <div class="count" id="count">항목: 0개</div>
      <textarea id="jsonOutput" readonly></textarea>
      <button class="btn-copy" onclick="copyJson()">📋 JSON 복사</button>
      <button class="btn-clear" onclick="clearAll()">🗑 전체 초기화</button>

      <div class="import-area">
        <label style="margin-top:16px">기존 JSON 불러오기 (curriculum-images.json 내용 붙여넣기)</label>
        <textarea id="importInput" placeholder="기존 JSON을 여기 붙여넣고 아래 버튼 클릭"></textarea>
        <button style="margin-top:8px; background:#6366f1; color:#fff; padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:0.88rem;" onclick="importJson()">불러오기</button>
      </div>
    </div>

    <div class="card full-width">
      <h2>추가된 항목 미리보기</h2>
      <div id="previewList" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:10px; margin-top:8px;"></div>
    </div>

  </div>
  <div class="toast" id="toast"></div>

  <script>
    let entries = [];
    let counter = 1;

    function previewImg() {
      const url = document.getElementById('imgUrl').value.trim();
      const img = document.getElementById('imgPreview');
      if (url) {
        img.src = url;
        img.style.display = 'block';
        img.onerror = () => { img.style.display = 'none'; };
      } else {
        img.style.display = 'none';
      }
    }

    function addEntry() {
      const url = document.getElementById('imgUrl').value.trim();
      const title = document.getElementById('imgTitle').value.trim();
      if (!url || !title) { showToast('URL과 제목은 필수입니다.'); return; }

      const tags = document.getElementById('imgTags').value
        .split(',').map(t => t.trim()).filter(Boolean);

      const entry = {
        id: `nrich-${String(counter).padStart(3, '0')}`,
        title,
        url,
        grade: parseInt(document.getElementById('imgGrade').value),
        subject: document.getElementById('imgSubject').value,
        tags
      };
      counter++;
      entries.push(entry);
      updateOutput();
      clearForm();
      showToast('추가되었습니다!');
    }

    function updateOutput() {
      const dataset = {
        _meta: {
          description: "초등 교과 과정 이미지 데이터셋 (NRICH 국립수학과학교육원)",
          source: "https://portal.nrich.go.kr/kor/textbookUseCulturalUsrList.do?menuIdx=1229",
          updated: new Date().toISOString().slice(0,10),
          schema: {
            id: "고유 식별자 (예: nrich-001)",
            title: "이미지 제목",
            url: "직접 접근 가능한 이미지 URL",
            grade: "학년 (1~6, 0=공통)",
            subject: "과목 (국어/수학/과학/사회/도덕/미술/음악/체육/영어)",
            tags: "검색용 태그 배열"
          }
        },
        images: entries
      };
      document.getElementById('jsonOutput').value = JSON.stringify(dataset, null, 2);
      document.getElementById('count').textContent = `항목: ${entries.length}개`;
      renderPreview();
    }

    function renderPreview() {
      const list = document.getElementById('previewList');
      list.innerHTML = entries.map((e, i) => `
        <div style="position:relative; border:1px solid #eee; border-radius:8px; overflow:hidden; background:#f9f9f9;">
          <img src="${e.url}" style="width:100%; height:90px; object-fit:cover; display:block;" onerror="this.style.background='#eee'">
          <div style="padding:6px 8px;">
            <div style="font-size:0.78rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${e.title}</div>
            <div style="font-size:0.72rem; color:#888;">${e.grade > 0 ? e.grade+'학년 · ' : ''}${e.subject}</div>
          </div>
          <button onclick="removeEntry(${i})" style="position:absolute; top:4px; right:4px; background:rgba(0,0,0,0.5); color:#fff; border:none; border-radius:4px; padding:2px 6px; font-size:0.72rem; cursor:pointer;">✕</button>
        </div>
      `).join('');
    }

    function removeEntry(i) {
      entries.splice(i, 1);
      updateOutput();
    }

    function clearForm() {
      document.getElementById('imgUrl').value = '';
      document.getElementById('imgTitle').value = '';
      document.getElementById('imgTags').value = '';
      document.getElementById('imgPreview').style.display = 'none';
    }

    function clearAll() {
      if (!entries.length || confirm('전체 초기화할까요?')) {
        entries = [];
        counter = 1;
        updateOutput();
      }
    }

    function copyJson() {
      navigator.clipboard.writeText(document.getElementById('jsonOutput').value)
        .then(() => showToast('클립보드에 복사됐습니다!'));
    }

    function importJson() {
      try {
        const data = JSON.parse(document.getElementById('importInput').value);
        if (data.images && Array.isArray(data.images)) {
          entries = data.images;
          const ids = entries.map(e => parseInt(e.id?.replace(/\D/g,''))).filter(n => !isNaN(n));
          counter = ids.length ? Math.max(...ids) + 1 : entries.length + 1;
          updateOutput();
          document.getElementById('importInput').value = '';
          showToast(`${entries.length}개 항목을 불러왔습니다!`);
        } else {
          showToast('유효한 데이터셋 JSON이 아닙니다.');
        }
      } catch (e) {
        showToast('JSON 파싱 오류: ' + e.message);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2500);
    }

    updateOutput();
  </script>
</body>
</html>
