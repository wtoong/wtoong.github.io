<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 진단 문제 빌더</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f1f5f9; min-height: 100vh; color: #1e293b; }

    header { background: #1e293b; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header span { font-size: 0.82rem; color: #94a3b8; }

    .layout { display: grid; grid-template-columns: 380px 1fr; min-height: calc(100vh - 54px); }

    .sidebar { background: #fff; border-right: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    .sidebar h2 { font-size: 0.9rem; font-weight: 700; color: #334155; }

    label.field { display: block; font-size: 0.78rem; color: #64748b; margin-bottom: 3px; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select, input[type=text], input[type=number], textarea {
      width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 0.85rem; font-family: inherit;
    }
    textarea { resize: vertical; line-height: 1.5; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
    .field-group { margin-bottom: 4px; }

    .btn { padding: 9px 16px; border: none; border-radius: 7px; cursor: pointer; font-size: 0.88rem; font-weight: 600; transition: background 0.15s; }
    .btn-primary { background: #3b82f6; color: #fff; width: 100%; }
    .btn-primary:hover { background: #2563eb; }
    .btn-success { background: #10b981; color: #fff; }
    .btn-success:hover { background: #059669; }
    .btn-danger  { background: #ef4444; color: #fff; }
    .btn-danger:hover  { background: #dc2626; }
    .btn-gray { background: #475569; color: #fff; }

    .hint { font-size: 0.74rem; color: #94a3b8; line-height: 1.5; }

    .import-section details summary { font-size: 0.85rem; font-weight: 600; color: #475569; cursor: pointer; padding: 4px 0; }
    .import-section textarea { margin-top: 8px; height: 110px; font-family: monospace; font-size: 0.76rem; }

    .stat { font-size: 0.82rem; color: #64748b; }
    .stat strong { color: #1e293b; }

    .main { padding: 20px; overflow-y: auto; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 260px; color: #94a3b8; gap: 8px; }
    .empty-state .icon { font-size: 3rem; }

    .qcard { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; padding: 12px 14px; margin-bottom: 10px; }
    .qcard .meta { font-size: 0.72rem; color: #64748b; margin-bottom: 4px; }
    .qcard .tag { display: inline-block; background: #eef2ff; color: #4338ca; padding: 1px 7px; border-radius: 4px; margin-right: 4px; }
    .qcard .tag.num { background: #ecfdf5; color: #047857; }
    .qcard .prompt { font-size: 0.92rem; font-weight: 600; margin-bottom: 4px; }
    .qcard .ans { font-size: 0.82rem; color: #334155; }
    .qcard .ans b { color: #059669; }
    .qcard .del { float: right; padding: 3px 9px; background: none; border: 1px solid #fca5a5; border-radius: 5px; color: #ef4444; cursor: pointer; font-size: 0.74rem; }
    .qcard .del:hover { background: #fef2f2; }

    .coverage { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .coverage h3 { font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: #334155; }
    .cov-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
    .cov-item { font-size: 0.74rem; padding: 4px 8px; border-radius: 6px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; justify-content: space-between; }
    .cov-item.zero { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }

    .toast { position: fixed; bottom: 24px; right: 24px; background: #1e293b; color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.88rem; opacity: 0; transform: translateY(8px); transition: all 0.2s; pointer-events: none; z-index: 999; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 760px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { border-right: none; border-bottom: 1px solid #e2e8f0; }
    }
  </style>
</head>
<body>

<header>
  <h1>🧮 수학 진단 문제 빌더</h1>
  <span>math-questions.json 생성 도구 · 단원 구조는 math-curriculum.json 사용</span>
</header>

<div class="layout">

  <!-- ─── 사이드바: 문제 입력 ─── -->
  <aside class="sidebar">
    <h2>문제 추가</h2>

    <div class="field-group">
      <label class="field">학년 → 단원 → 세부기능</label>
      <div class="row2">
        <select id="gradeSel" onchange="onGradeChange()"></select>
        <select id="unitSel" onchange="onUnitChange()"></select>
      </div>
      <select id="skillSel" style="margin-top:6px"></select>
    </div>

    <div class="field-group row2">
      <div>
        <label class="field">유형</label>
        <select id="typeSel" onchange="onTypeChange()">
          <option value="mc">객관식 (mc)</option>
          <option value="numeric">단답 숫자 (numeric)</option>
        </select>
      </div>
      <div>
        <label class="field">난이도</label>
        <select id="diffSel">
          <option value="1">1 (쉬움)</option>
          <option value="2" selected>2 (보통)</option>
          <option value="3">3 (어려움)</option>
        </select>
      </div>
    </div>

    <div class="field-group">
      <label class="field">문제 글</label>
      <textarea id="promptInput" rows="2" placeholder="예) 27 + 15 = ?"></textarea>
    </div>

    <div class="field-group" id="choicesGroup">
      <label class="field">보기 (한 줄에 하나, 첫 줄이 정답이 아니어도 됨)</label>
      <textarea id="choicesInput" rows="4" placeholder="42&#10;43&#10;52&#10;32"></textarea>
    </div>

    <div class="field-group">
      <label class="field" id="answerLabel">정답</label>
      <input type="text" id="answerInput" placeholder="예) 42">
    </div>

    <div class="field-group" id="tolGroup" style="display:none">
      <label class="field">허용 오차 (소수 답일 때만, 보통 0.001)</label>
      <input type="number" id="tolInput" step="0.001" placeholder="0">
    </div>

    <button class="btn btn-primary" onclick="addQuestion()">＋ 문제 추가</button>

    <div class="import-section">
      <details>
        <summary>기존 math-questions.json 이어서 편집</summary>
        <textarea id="importInput" placeholder="math-questions.json 내용을 여기 붙여넣기"></textarea>
        <button class="btn btn-gray" style="margin-top:6px;width:100%" onclick="importJson()">불러오기</button>
      </details>
    </div>

    <div class="stat" id="stat">문제: <strong>0</strong>개</div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-success" style="flex:1" onclick="downloadJson()">JSON 다운로드</button>
      <button class="btn btn-gray" onclick="copyJson()">📋 복사</button>
      <button class="btn btn-danger" onclick="clearAll()">전체 삭제</button>
    </div>
    <p class="hint">다운로드한 파일을 <b>data/math-questions.json</b> 으로 저장하면 진단 페이지에 바로 반영됩니다.</p>
  </aside>

  <!-- ─── 메인: 커버리지 + 문제 목록 ─── -->
  <main class="main">
    <div class="coverage">
      <h3>단원별 문제 수 (빨강 = 0개, 보강 필요)</h3>
      <div class="cov-grid" id="coverage"></div>
    </div>
    <div id="list">
      <div class="empty-state" id="emptyState">
        <div class="icon">🧮</div>
        <p>왼쪽에서 단원을 고르고 문제를 추가하세요.</p>
      </div>
    </div>
  </main>

</div>

<div class="toast" id="toast"></div>

<script>
  let curriculum = null;
  let questions = [];   // 문제 객체 배열
  let counter = 1;

  /* ── 교육과정 구조 로드 ── */
  fetch('math-curriculum.json')
    .then(r => r.json())
    .then(data => { curriculum = data; initGradeSelect(); renderCoverage(); })
    .catch(() => showToast('math-curriculum.json을 불러오지 못했어요'));

  function initGradeSelect() {
    const gs = document.getElementById('gradeSel');
    gs.innerHTML = curriculum.grades
      .map(g => `<option value="${g.grade}">${g.grade}학년</option>`).join('');
    onGradeChange();
  }

  function gradeObj(grade) {
    return curriculum.grades.find(g => String(g.grade) === String(grade));
  }
  function unitObj(grade, unitId) {
    const g = gradeObj(grade);
    return g && g.units.find(u => u.unitId === unitId);
  }

  function onGradeChange() {
    const grade = document.getElementById('gradeSel').value;
    const g = gradeObj(grade);
    document.getElementById('unitSel').innerHTML =
      g.units.map(u => `<option value="${u.unitId}">${u.unitName}</option>`).join('');
    onUnitChange();
  }
  function onUnitChange() {
    const grade = document.getElementById('gradeSel').value;
    const unitId = document.getElementById('unitSel').value;
    const u = unitObj(grade, unitId);
    document.getElementById('skillSel').innerHTML =
      (u.skills || []).map(s => `<option value="${s.skillId}">${s.skillName}</option>`).join('');
  }

  function onTypeChange() {
    const t = document.getElementById('typeSel').value;
    document.getElementById('choicesGroup').style.display = t === 'mc' ? 'block' : 'none';
    document.getElementById('tolGroup').style.display = t === 'numeric' ? 'block' : 'none';
    document.getElementById('answerLabel').textContent =
      t === 'mc' ? '정답 (보기 중 하나와 똑같이)' : '정답 (숫자)';
  }

  function nextId() { return `q-${String(counter++).padStart(4, '0')}`; }

  /* ── 문제 추가 ── */
  function addQuestion() {
    const grade = parseInt(document.getElementById('gradeSel').value);
    const unitId = document.getElementById('unitSel').value;
    const skillId = document.getElementById('skillSel').value;
    const type = document.getElementById('typeSel').value;
    const difficulty = parseInt(document.getElementById('diffSel').value);
    const prompt = document.getElementById('promptInput').value.trim();
    const answerRaw = document.getElementById('answerInput').value.trim();

    if (!prompt) { showToast('문제 글을 적어주세요'); return; }
    if (!answerRaw) { showToast('정답을 적어주세요'); return; }

    const q = { id: nextId(), grade, unitId, skillId, difficulty, type, prompt };

    if (type === 'mc') {
      const choices = document.getElementById('choicesInput').value
        .split('\n').map(s => s.trim()).filter(Boolean);
      if (choices.length < 2) { showToast('보기를 2개 이상 적어주세요'); return; }
      if (!choices.includes(answerRaw)) { showToast('정답이 보기 안에 없어요'); return; }
      q.choices = choices;
      q.answer = answerRaw;
    } else {
      const num = parseFloat(answerRaw);
      if (isNaN(num)) { showToast('숫자 정답을 적어주세요'); return; }
      q.answer = num;
      const tol = parseFloat(document.getElementById('tolInput').value);
      if (!isNaN(tol) && tol > 0) q.tolerance = tol;
    }

    questions.push(q);
    document.getElementById('promptInput').value = '';
    document.getElementById('choicesInput').value = '';
    document.getElementById('answerInput').value = '';
    render();
    showToast('문제를 추가했어요!');
  }

  function removeQuestion(id) {
    questions = questions.filter(q => q.id !== id);
    render();
  }

  function clearAll() {
    if (!questions.length || confirm('문제를 전부 삭제할까요?')) {
      questions = []; counter = 1; render();
    }
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }

  /* ── 렌더링 ── */
  function render() {
    const list = document.getElementById('list');
    const empty = document.getElementById('emptyState');
    if (!questions.length) {
      list.innerHTML = '';
      list.appendChild(empty);
      empty.style.display = 'flex';
    } else {
      list.innerHTML = questions.slice().reverse().map(q => `
        <div class="qcard">
          <button class="del" onclick="removeQuestion('${q.id}')">✕ 삭제</button>
          <div class="meta">
            <span class="tag ${q.type === 'numeric' ? 'num' : ''}">${q.type}</span>
            <span class="tag">${q.grade}학년 · ${unitName(q.unitId)}</span>
            난이도 ${q.difficulty} · ${q.id}
          </div>
          <div class="prompt">${escHtml(q.prompt)}</div>
          <div class="ans">
            ${q.type === 'mc' ? '보기: ' + q.choices.map(escHtml).join(' / ') + '<br>' : ''}
            정답: <b>${escHtml(q.answer)}</b>${q.tolerance ? ` (±${q.tolerance})` : ''}
          </div>
        </div>`).join('');
    }
    document.getElementById('stat').innerHTML = `문제: <strong>${questions.length}</strong>개`;
    renderCoverage();
  }

  function unitName(unitId) {
    if (!curriculum) return unitId;
    for (const g of curriculum.grades) {
      const u = g.units.find(x => x.unitId === unitId);
      if (u) return u.unitName;
    }
    return unitId;
  }

  function renderCoverage() {
    if (!curriculum) return;
    const counts = {};
    questions.forEach(q => { counts[q.unitId] = (counts[q.unitId] || 0) + 1; });
    const cells = [];
    curriculum.grades.forEach(g => g.units.forEach(u => {
      const n = counts[u.unitId] || 0;
      cells.push(`<div class="cov-item ${n === 0 ? 'zero' : ''}">
        <span>${g.grade}-${u.unitName}</span><b>${n}</b></div>`);
    }));
    document.getElementById('coverage').innerHTML = cells.join('');
  }

  /* ── JSON 생성 / 내보내기 ── */
  function buildJson() {
    return JSON.stringify({
      _meta: {
        description: "초등 수학 진단 문제 은행 (1~6학년 전 단원). 자동 채점용(mc/numeric)만.",
        updated: new Date().toISOString().slice(0, 10),
        schema: {
          id: "q-NNNN", grade: "학년 1~6", unitId: "단원 식별자", skillId: "세부 기능",
          difficulty: "1~3", type: "mc | numeric", prompt: "문제 글",
          choices: "mc 보기 배열", answer: "정답", tolerance: "numeric 허용 오차(선택)"
        }
      },
      questions
    }, null, 2);
  }

  function copyJson() {
    navigator.clipboard.writeText(buildJson()).then(() => showToast('클립보드에 복사됐어요!'));
  }

  function downloadJson() {
    if (!questions.length) { showToast('문제가 없어요'); return; }
    const blob = new Blob([buildJson()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'math-questions.json';
    a.click();
    showToast('다운로드 시작!');
  }

  /* ── 기존 JSON 불러오기 (id 중복 제거) ── */
  function importJson() {
    try {
      const data = JSON.parse(document.getElementById('importInput').value);
      if (!Array.isArray(data.questions)) throw new Error('questions 배열이 없어요');
      const before = questions.length;
      data.questions.forEach(q => {
        if (!questions.some(x => x.id === q.id)) questions.push(q);
      });
      const nums = questions.map(q => parseInt(String(q.id).replace(/\D/g, ''))).filter(n => !isNaN(n));
      if (nums.length) counter = Math.max(...nums) + 1;
      document.getElementById('importInput').value = '';
      render();
      showToast(`${questions.length - before}개 추가됨 (총 ${questions.length}개)`);
    } catch (e) { showToast('오류: ' + e.message); }
  }

  /* ── 토스트 ── */
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  onTypeChange();
</script>
</body>
</html>
