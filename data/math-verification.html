<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수학 문제 탐색기 · 검증</title>
  <link rel="stylesheet" href="../math.css?v=8">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f1f5f9; min-height: 100vh; color: #1e293b; }

    header { background: #1e293b; color: #fff; padding: 16px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header span { font-size: 0.82rem; color: #94a3b8; }
    header a { color: #93c5fd; font-size: 0.82rem; font-weight: 700; text-decoration: none; }

    .wrap { padding: 20px; max-width: 1100px; margin: 0 auto; }

    .controls { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
    .controls .grp { display: flex; gap: 6px; align-items: center; }
    .controls .lbl { font-size: 0.78rem; color: #64748b; margin-right: 2px; }
    .chip { padding: 5px 11px; border: 1px solid #cbd5e1; border-radius: 999px; background: #f8fafc; cursor: pointer; font-size: 0.82rem; }
    .chip.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }

    .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 10px; margin-bottom: 16px; }
    .scard { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; }
    .scard .num { font-size: 1.5rem; font-weight: 800; }
    .scard .cap { font-size: 0.76rem; color: #64748b; margin-top: 2px; }
    .scard.warn .num { color: #b91c1c; }
    .scard.ok .num { color: #059669; }
    .scard.tmpl .num { color: #7c3aed; }

    .warnbox { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
    .warnbox h3 { font-size: 0.86rem; color: #9a3412; margin-bottom: 6px; }
    .warnbox ul { margin-left: 18px; }
    .warnbox li { font-size: 0.8rem; color: #7c2d12; line-height: 1.6; }
    .warnbox.clean { background: #ecfdf5; border-color: #a7f3d0; }
    .warnbox.clean h3 { color: #047857; }

    .grade-block { margin-bottom: 18px; }
    .grade-title { font-size: 1rem; font-weight: 800; color: #334155; margin: 6px 0 8px; }
    .sem-title { font-size: 0.82rem; font-weight: 700; color: #64748b; margin: 6px 0; }

    .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
    .unit-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px 14px; cursor: pointer; transition: box-shadow .12s, transform .12s; }
    .unit-card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); transform: translateY(-1px); }
    .unit-card.selected { box-shadow: 0 0 0 2px #3b82f6; }
    .unit-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; gap: 8px; }
    .unit-name { font-size: 0.95rem; font-weight: 700; }
    .unit-total { font-size: 0.8rem; color: #64748b; flex-shrink: 0; }
    .unit-total b { color: #1e293b; }
    .unit-split { font-size: 0.74rem; color: #64748b; margin-bottom: 8px; }
    .unit-split .t { color: #7c3aed; font-weight: 700; }
    .unit-split .f { color: #475569; font-weight: 700; }

    .skill-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 9px; border-radius: 7px; margin-bottom: 4px; border: 1px solid transparent; }
    .skill-row .sname { font-size: 0.82rem; }
    .skill-row .scount { font-size: 0.78rem; font-weight: 700; flex-shrink: 0; }
    .skill-row.s0 { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
    .skill-row.s1 { background: #fffbeb; border-color: #fde68a; color: #92400e; }
    .skill-row.s2 { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; }

    .legend { font-size: 0.76rem; color: #64748b; margin-bottom: 12px; }
    .legend .b { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 3px 0 10px; vertical-align: middle; }

    /* ── 문항 미리보기 패널 ── */
    #preview:not(:empty) { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; box-shadow: 0 6px 20px rgba(15,23,42,.08); }
    .pv-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
    .pv-title { font-size: 1rem; font-weight: 800; color: #1e293b; }
    .pv-sub { font-size: 0.78rem; color: #64748b; }
    .pv-bar .act { margin-left: auto; display: flex; gap: 8px; }
    .pv-btn { padding: 5px 12px; border: 1px solid #cbd5e1; border-radius: 999px; background: #f8fafc; cursor: pointer; font-size: 0.8rem; font-weight: 700; }
    .pv-btn:hover { background: #eef2ff; }
    .pv-btn.close { color: #b91c1c; }

    .pv-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
    .pv-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 12px; background: #fafafa; }
    .pv-card.fail { border-color: #fca5a5; background: #fef2f2; }
    .pv-chead { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .pv-id { font-size: 0.72rem; font-weight: 700; color: #475569; font-family: ui-monospace, monospace; }
    .badge { font-size: 0.68rem; font-weight: 800; padding: 2px 7px; border-radius: 999px; }
    .badge.b-f { background: #e2e8f0; color: #475569; }
    .badge.b-t { background: #ede9fe; color: #6d28d9; }
    .pv-meta { font-size: 0.7rem; color: #94a3b8; }
    .pv-reroll { margin-left: auto; padding: 3px 9px; border: 1px solid #ddd6fe; border-radius: 999px; background: #f5f3ff; color: #6d28d9; cursor: pointer; font-size: 0.74rem; font-weight: 700; }
    .pv-reroll:hover { background: #ede9fe; }

    .pv-prompt { font-size: 0.92rem; line-height: 1.5; color: #1e293b; margin-bottom: 8px; white-space: pre-wrap; }
    .pv-choices { display: flex; flex-wrap: wrap; gap: 6px; }
    .pv-choice { font-size: 0.8rem; padding: 4px 9px; border-radius: 7px; background: #fff; border: 1px solid #e2e8f0; color: #475569; }
    .pv-choice.correct { background: #ecfdf5; border-color: #6ee7b7; color: #047857; font-weight: 700; }
    .pv-num { font-size: 0.85rem; color: #334155; }
    .pv-num b { color: #047857; }
    .pv-tol { color: #94a3b8; font-size: 0.78rem; }
    .pv-seed { margin-top: 8px; font-size: 0.68rem; color: #a78bfa; font-family: ui-monospace, monospace; }
    .pv-fail { margin-top: 6px; font-size: 0.8rem; color: #b91c1c; font-weight: 700; }
    /* 검증 미리보기 — 표는 보여 주고(문제 검토용), 클릭 안내문만 숨김 */
    .pv-bg-widget .bg-instruction { display: none; }
    .pv-bg-widget { transform: scale(0.85); transform-origin: top left; margin-bottom: -10px; }
  </style>
</head>
<body>

<header>
  <h1>🔍 수학 문제 탐색기 · 검증</h1>
  <span>단원을 콕 누르면 실제 문항을 미리보고, 템플릿은 시드로 굴려봐요</span>
  <a href="math-question-builder.html" style="margin-left:auto;">📝 문제 빌더로</a>
</header>

<div class="wrap">
  <div class="controls">
    <div class="grp"><span class="lbl">학년</span><div id="gradeChips"></div></div>
    <div class="grp"><span class="lbl">학기</span><div id="semChips"></div></div>
    <div class="grp" style="margin-left:auto;">
      <button id="smokeBtn" class="chip" style="font-weight:700;">🎲 전체 템플릿 오류 점검</button>
    </div>
  </div>

  <div id="tmplSmoke"></div>
  <div id="preview"></div>

  <p class="legend">
    세부기능 색:
    <span class="b" style="background:#fecaca"></span>0개(보강 필요)
    <span class="b" style="background:#fde68a"></span>1개(부족)
    <span class="b" style="background:#a7f3d0"></span>2개+(충분)
    &nbsp;·&nbsp; 단원 카드를 누르면 그 단원 문항을 미리볼 수 있어요.
  </p>

  <div class="summary" id="summary"></div>
  <div id="warnings"></div>
  <div id="report"></div>
</div>

<script src="../question-bank.js?v=1"></script>
<script src="../question-template.js?v=3"></script>
<script src="../question-figures.js?v=8"></script>
<script>
  QuestionBank.basePath = 'questions/';   // 이 페이지는 data/ 안에 있음
  let curriculum = null, questions = [];
  let fGrade = 4, fSem = 1;       // 기본 초점: 4학년 1학기
  let selectedUnit = null;        // 미리보기 중인 단원
  let previewList = [];           // 그 단원 문항들
  let previewSeeds = [];          // 카드별 현재 시드(템플릿)

  const unitNameMap = {};         // unitId → 단원명 (미리보기 제목용)

  Promise.all([
    fetch('math-curriculum.json').then(r => r.json()),
    QuestionBank.loadAll(),
  ]).then(([curr, qs]) => {
    curriculum = curr; questions = qs;
    curriculum.grades.forEach(g => g.units.forEach(u => { unitNameMap[u.unitId] = u.unitName; }));
    initChips();
    render();
  }).catch(e => {
    document.getElementById('report').innerHTML =
      '<p style="color:#b91c1c">데이터를 불러오지 못했어요: ' + e.message + '</p>';
  });

  // ── 유틸 ──
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // LaTeX 렌더링 (latex:true 문항용) — $...$ 구간만 KaTeX로, 나머지는 esc
  let _katexReady = false;
  function ensureKatex(cb) {
    if (_katexReady) { cb(); return; }
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';
    document.head.appendChild(link);
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';
    s.onload = () => { _katexReady = true; cb(); };
    document.head.appendChild(s);
  }

  function renderDisplay(text, isLatex) {
    if (!isLatex || !window.katex) return esc(String(text));
    return String(text).split(/(\$[^$]+\$)/g).map((part, i) => {
      if (i % 2 === 1) {
        const math = part.slice(1, -1);
        return katex.renderToString(math, { throwOnError: false, displayMode: false });
      }
      return esc(part);
    }).join('');
  }
  function randSeed() { return (Math.random() * 0xffffffff) >>> 0; }
  function typeLabel(t) {
    return t === 'mc' ? '객관식' : t === 'bar-graph' ? '막대그래프' : t === 'bar-graph-read' ? '막대그래프 읽기' : '단답형';
  }

  function semOf(unitId) {
    for (const g of curriculum.grades) {
      const u = g.units.find(x => x.unitId === unitId);
      if (u) return u.semester || (parseInt(unitId.split('-')[1], 10) <= 2 ? 1 : 2);
    }
    return parseInt(unitId.split('-')[1], 10) <= 2 ? 1 : 2;
  }

  // ── 칩 ──
  function initChips() {
    const gc = document.getElementById('gradeChips');
    gc.innerHTML = `<span class="chip" data-g="0">전체</span>` +
      curriculum.grades.map(g => `<span class="chip" data-g="${g.grade}">${g.grade}학년</span>`).join('');
    const sc = document.getElementById('semChips');
    sc.innerHTML = `<span class="chip" data-s="0">전체</span>` +
      `<span class="chip" data-s="1">1학기</span><span class="chip" data-s="2">2학기</span>`;
    gc.querySelectorAll('.chip').forEach(c => c.onclick = () => { fGrade = +c.dataset.g; render(); });
    sc.querySelectorAll('.chip').forEach(c => c.onclick = () => { fSem = +c.dataset.s; render(); });
  }
  function syncChips() {
    document.querySelectorAll('#gradeChips .chip').forEach(c =>
      c.classList.toggle('active', +c.dataset.g === fGrade));
    document.querySelectorAll('#semChips .chip').forEach(c =>
      c.classList.toggle('active', +c.dataset.s === fSem));
  }

  // ── 메인 렌더 ──
  function render() {
    syncChips();

    // 집계
    const unitCount = {}, unitTmpl = {}, skillCount = {}, skillDiff = {};
    const validUnits = new Set(), validSkills = new Set();
    curriculum.grades.forEach(g => g.units.forEach(u => {
      validUnits.add(u.unitId);
      (u.skills || []).forEach(s => validSkills.add(s.skillId));
    }));
    questions.forEach(q => {
      unitCount[q.unitId] = (unitCount[q.unitId] || 0) + 1;
      if (q.template) unitTmpl[q.unitId] = (unitTmpl[q.unitId] || 0) + 1;
      skillCount[q.skillId] = (skillCount[q.skillId] || 0) + 1;
      (skillDiff[q.skillId] = skillDiff[q.skillId] || { 1: 0, 2: 0, 3: 0 })[q.difficulty]++;
    });

    // 요약
    let totalSkills = 0, emptySkills = 0, emptyUnits = 0, totalUnits = 0;
    curriculum.grades.forEach(g => g.units.forEach(u => {
      totalUnits++;
      if (!unitCount[u.unitId]) emptyUnits++;
      (u.skills || []).forEach(s => { totalSkills++; if (!skillCount[s.skillId]) emptySkills++; });
    }));
    const orphans = questions.filter(q => !validUnits.has(q.unitId) || !validSkills.has(q.skillId));
    const tmplTotal = questions.filter(q => q.template).length;
    const fixedTotal = questions.length - tmplTotal;

    document.getElementById('summary').innerHTML = [
      `<div class="scard"><div class="num">${questions.length}</div><div class="cap">전체 문항</div></div>`,
      `<div class="scard"><div class="num">${fixedTotal}</div><div class="cap">고정 문항</div></div>`,
      `<div class="scard tmpl"><div class="num">${tmplTotal}</div><div class="cap">🎲 템플릿 문항</div></div>`,
      `<div class="scard ${emptyUnits ? 'warn' : 'ok'}"><div class="num">${emptyUnits}</div><div class="cap">문항 0개 단원</div></div>`,
      `<div class="scard ${emptySkills ? 'warn' : 'ok'}"><div class="num">${emptySkills}</div><div class="cap">문항 0개 세부기능</div></div>`,
      `<div class="scard ${orphans.length ? 'warn' : 'ok'}"><div class="num">${orphans.length}</div><div class="cap">커리큘럼 밖(orphan)</div></div>`,
    ].join('');

    // 경고 (빠진 세부기능 + orphan)
    const wlines = [];
    if (orphans.length) {
      wlines.push('<b>커리큘럼에 없는 unitId/skillId 문항:</b>');
      orphans.slice(0, 30).forEach(q => wlines.push(`· ${q.id} — unit ${q.unitId} / skill ${q.skillId}`));
      if (orphans.length > 30) wlines.push(`· … 외 ${orphans.length - 30}개`);
    }
    const emptyListArr = [];
    curriculum.grades.forEach(g => g.units.forEach(u => (u.skills || []).forEach(s => {
      if (!skillCount[s.skillId]) emptyListArr.push(`${g.grade}학년 · ${u.unitName} · ${s.skillName} (${s.skillId})`);
    })));
    const wb = document.getElementById('warnings');
    if (!orphans.length && !emptyListArr.length) {
      wb.innerHTML = `<div class="warnbox clean"><h3>✅ 빠진 문제 유형이 없어요!</h3>
        <p style="font-size:0.8rem;color:#065f46">모든 단원의 모든 세부기능에 문제가 1개 이상 있어요.</p></div>`;
    } else {
      let html = '<div class="warnbox"><h3>⚠️ 점검이 필요해요</h3><ul>';
      if (emptyListArr.length) {
        html += `<li><b>문항이 0개인 세부기능 (${emptyListArr.length}개):</b><ul>` +
          emptyListArr.map(t => `<li>${esc(t)}</li>`).join('') + '</ul></li>';
      }
      if (wlines.length) html += `<li>${wlines.join('<br>')}</li>`;
      html += '</ul></div>';
      wb.innerHTML = html;
    }

    // 학년 → 학기 → 단원 → 세부기능
    const out = [];
    curriculum.grades.forEach(g => {
      if (fGrade && g.grade !== fGrade) return;
      const sems = [1, 2].filter(s => !fSem || s === fSem);
      const semBlocks = [];
      sems.forEach(sem => {
        const units = g.units.filter(u => semOf(u.unitId) === sem);
        if (!units.length) return;
        const cards = units.map(u => {
          const total = unitCount[u.unitId] || 0;
          const t = unitTmpl[u.unitId] || 0;
          const skills = (u.skills || []).map(s => {
            const n = skillCount[s.skillId] || 0;
            const cls = n === 0 ? 's0' : (n === 1 ? 's1' : 's2');
            return `<div class="skill-row ${cls}"><span class="sname">${esc(s.skillName)}</span><span class="scount">${n}개</span></div>`;
          }).join('');
          return `<div class="unit-card ${selectedUnit === u.unitId ? 'selected' : ''}" data-unit="${u.unitId}">
            <div class="unit-head"><span class="unit-name">${esc(u.unitName)}</span>
              <span class="unit-total">문항 <b>${total}</b></span></div>
            <div class="unit-split"><span class="f">고정 ${total - t}</span> · <span class="t">🎲 템플릿 ${t}</span></div>
            ${skills || '<div class="unit-split">세부기능 정의 없음</div>'}
          </div>`;
        }).join('');
        semBlocks.push(`<div class="sem-title">${sem}학기</div><div class="unit-grid">${cards}</div>`);
      });
      if (semBlocks.length) {
        out.push(`<div class="grade-block"><div class="grade-title">${g.grade}학년</div>${semBlocks.join('')}</div>`);
      }
    });
    const report = document.getElementById('report');
    report.innerHTML = out.join('') || '<p style="color:#64748b">선택한 범위에 단원이 없어요.</p>';
    report.querySelectorAll('.unit-card').forEach(card =>
      card.onclick = () => openPreview(card.dataset.unit));
  }

  // ── 미리보기 패널 ──
  function openPreview(unitId) {
    selectedUnit = unitId;
    previewList = questions.filter(q => q.unitId === unitId)
      .sort((a, b) => (a.template ? 1 : 0) - (b.template ? 1 : 0) || String(a.id).localeCompare(b.id));
    previewSeeds = previewList.map(q => q.template ? randSeed() : null);
    const needsLatex = previewList.some(q => q.latex);
    const doRender = () => {
      renderPreview();
      render(); // 선택 표시 갱신
      document.getElementById('preview').scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
    if (needsLatex) ensureKatex(doRender);
    else doRender();
  }

  function instanceHTML(q, seed) {
    const tmpl = !!q.template;
    let c = q;
    if (tmpl) {
      try { c = QuestionTemplate.instantiate(q, seed != null ? { seed: seed } : undefined); }
      catch (e) { return `<div class="pv-fail">⚠️ 생성 오류 — ${esc(e.message)}</div>`; }
      if (c.__templateFailed) return `<div class="pv-fail">⚠️ 제약을 만족하는 값을 못 찾았어요</div>`;
      if (typeof c.prompt !== 'string' || /\{[a-zA-Z_]/.test(c.prompt))
        return `<div class="pv-fail">⚠️ 자리표시자 미치환 — "${esc(String(c.prompt))}"</div>`;
    }
    const isLatex = !!q.latex;
    let body = `<div class="pv-prompt">${renderDisplay(c.prompt, isLatex)}</div>`;
    if (c.figure && c._vars && window.QuestionFigures) {
      const fig = QuestionFigures.render(c.figure, c._vars);
      if (fig) body += fig.outerHTML;
    }
    if (q.type === 'mc') {
      const chs = c.choices || [];
      body += `<div class="pv-choices">` + chs.map(ch => {
        const ok = String(ch) === String(c.answer);
        return `<span class="pv-choice ${ok ? 'correct' : ''}">${ok ? '✓ ' : ''}${renderDisplay(String(ch), isLatex)}</span>`;
      }).join('') + `</div>`;
      if (chs.indexOf(c.answer) < 0)
        body += `<div class="pv-fail">⚠️ 정답이 보기에 없음 (${renderDisplay(String(c.answer), isLatex)})</div>`;
    } else {
      // type 이름이 아니라 barGraph 필드 유무로 판단 — 막대그래프 계열 타입이 늘어도 자동 렌더
      const bg = c.barGraph || (q.template && q.template.barGraph);
      const vars = c._vars || {};
      if (bg && bg.labels && bg.valueVars && window.BarGraphWidget) {
        const vals = bg.valueVars.map(v => vars[v] != null ? Number(vars[v]) : 0);
        // 실제 위젯 렌더링 (정답 미리 채운 채로 markAnswers로 초록 표시)
        const bgw = BarGraphWidget.create({
          labels: bg.labels, correctValues: vals,
          unit: bg.unit || '',
          scale: bg.scaleVar ? Number(vars[bg.scaleVar]) : (bg.scale || 1),
          yMin: bg.yMin || 0,
          belowRows: bg.belowRowsVar ? Number(vars[bg.belowRowsVar]) : (bg.belowRows || 1),
        });
        bgw.prefill(vals);
        bgw.markAnswers(vals, vals);
        bgw.element.classList.add('pv-bg-widget');
        body += bgw.element.outerHTML;
      } else if (q.type === 'bar-graph') {
        body += `<div class="pv-num">막대그래프 문제 (barGraph 설정 없음)</div>`;
      }
      if (c.answer != null) {
        body += `<div class="pv-num">정답: <b>${renderDisplay(String(c.answer), isLatex)}</b>` +
          (c.tolerance ? ` <span class="pv-tol">±${c.tolerance}</span>` : '') + `</div>`;
      }
    }
    if (tmpl && seed != null) body += `<div class="pv-seed">seed ${seed}</div>`;
    return body;
  }

  function cardHTML(q, idx) {
    const tmpl = !!q.template;
    return `<div class="pv-card" id="pvc-${idx}">
      <div class="pv-chead">
        <span class="pv-id">${esc(q.id)}</span>
        <span class="badge ${tmpl ? 'b-t' : 'b-f'}">${tmpl ? '🎲 템플릿' : '고정'}</span>
        <span class="pv-meta">${esc(q.skillId || '')} · ${typeLabel(q.type)} · 난이도 ${q.difficulty}</span>
        ${tmpl ? `<button class="pv-reroll" data-idx="${idx}">🎲 다시</button>` : ''}
      </div>
      <div class="pv-body" id="pvb-${idx}">${instanceHTML(q, previewSeeds[idx])}</div>
    </div>`;
  }

  function renderPreview() {
    const box = document.getElementById('preview');
    if (!selectedUnit) { box.innerHTML = ''; return; }
    const tCount = previewList.filter(q => q.template).length;
    box.innerHTML = `
      <div class="pv-bar">
        <span class="pv-title">📋 ${esc(unitNameMap[selectedUnit] || selectedUnit)}</span>
        <span class="pv-sub">${selectedUnit} · 문항 ${previewList.length}개 (고정 ${previewList.length - tCount} · 🎲 ${tCount})</span>
        <span class="act">
          ${tCount ? `<button class="pv-btn" id="rerollAll">🎲 템플릿 모두 다시</button>` : ''}
          <button class="pv-btn close" id="pvClose">✕ 닫기</button>
        </span>
      </div>
      <div class="pv-list">${previewList.map((q, i) => cardHTML(q, i)).join('')}</div>`;

    box.querySelector('#pvClose').onclick = () => {
      selectedUnit = null; previewList = []; box.innerHTML = ''; render();
    };
    const rerollAll = box.querySelector('#rerollAll');
    if (rerollAll) rerollAll.onclick = () => {
      previewList.forEach((q, i) => { if (q.template) previewSeeds[i] = randSeed(); });
      previewList.forEach((q, i) => {
        if (q.template) document.getElementById('pvb-' + i).innerHTML = instanceHTML(q, previewSeeds[i]);
      });
    };
  }

  // 카드별 "다시 굴리기" (이벤트 위임)
  document.getElementById('preview').addEventListener('click', e => {
    const btn = e.target.closest('.pv-reroll');
    if (!btn) return;
    const idx = +btn.dataset.idx;
    previewSeeds[idx] = randSeed();
    document.getElementById('pvb-' + idx).innerHTML = instanceHTML(previewList[idx], previewSeeds[idx]);
  });

  // ── 전체 템플릿 오류 일괄 점검 ──
  // 모든 template 문항을 여러 번 인스턴스화해 생성 오류를 사전 적발한다.
  document.getElementById('smokeBtn').onclick = function () {
    const box = document.getElementById('tmplSmoke');
    if (!window.QuestionTemplate) {
      box.innerHTML = '<div class="warnbox"><h3>⚠️ question-template.js를 불러오지 못했어요</h3></div>';
      return;
    }
    const RUNS = 30;
    const templated = questions.filter(q => q.template);
    if (!templated.length) {
      box.innerHTML = '<div class="warnbox clean"><h3>🎲 템플릿 문항이 아직 없어요</h3>' +
        '<p style="font-size:0.8rem;color:#065f46">template 필드를 가진 문항이 없습니다.</p></div>';
      return;
    }
    const issues = [];
    templated.forEach(q => {
      for (let i = 0; i < RUNS; i++) {
        let c;
        try { c = window.QuestionTemplate.instantiate(q); }
        catch (e) { issues.push(`${q.id}: 생성 중 오류 — ${e.message}`); break; }
        if (c.__templateFailed) { issues.push(`${q.id}: 제약을 만족하는 값을 못 찾음`); break; }
        if (typeof c.prompt !== 'string' || /\{[a-zA-Z_]/.test(c.prompt)) {
          issues.push(`${q.id}: 자리표시자가 안 채워짐 — "${c.prompt}"`); break;
        }
        if (q.type === 'mc') {
          if (!Array.isArray(c.choices) || c.choices.length < 2) { issues.push(`${q.id}: 선택지 부족`); break; }
          if (c.choices.indexOf(c.answer) < 0) { issues.push(`${q.id}: 정답이 선택지에 없음 (${c.answer})`); break; }
          if (new Set(c.choices).size !== c.choices.length) { issues.push(`${q.id}: 선택지 중복 — ${JSON.stringify(c.choices)}`); break; }
        } else if (q.type === 'bar-graph' || q.type === 'bar-graph-read') {
          if (!c.barGraph || !c._vars) { issues.push(`${q.id}: barGraph 설정 또는 _vars 없음`); break; }
          const bg = c.barGraph;
          if (!bg.labels || !bg.valueVars || bg.labels.length !== bg.valueVars.length) {
            issues.push(`${q.id}: barGraph labels/valueVars 길이 불일치`); break;
          }
          const vals = bg.valueVars.map(v => c._vars[v]);
          if (vals.some(v => typeof v !== 'number' || !isFinite(v) || v < 0)) {
            issues.push(`${q.id}: _vars에 비정상 값 — ${JSON.stringify(vals)}`); break;
          }
          if (q.type === 'bar-graph-read' &&
              (typeof c.answer !== 'number' || !isFinite(c.answer) || c.answer < 0)) {
            issues.push(`${q.id}: 정답이 숫자가 아니거나 음수 (${c.answer})`); break;
          }
        } else {
          if (typeof c.answer !== 'number' || !isFinite(c.answer)) { issues.push(`${q.id}: 정답이 숫자가 아님 (${c.answer})`); break; }
          if (c.answer < 0) { issues.push(`${q.id}: 정답이 음수 (${c.answer})`); break; }
        }
      }
    });
    if (issues.length) {
      box.innerHTML = `<div class="warnbox"><h3>⚠️ 템플릿 문항 ${templated.length}개 중 ${issues.length}건 문제</h3>` +
        `<ul>${issues.map(t => `<li>${esc(t)}</li>`).join('')}</ul>` +
        `<p style="font-size:0.78rem;color:#7c2d12;margin-top:6px">단원 카드를 눌러 해당 문항을 미리보고 고쳐보세요.</p></div>`;
    } else {
      box.innerHTML = `<div class="warnbox clean"><h3>✅ 템플릿 문항 ${templated.length}개 모두 정상 (각 ${RUNS}회 생성)</h3>` +
        `<p style="font-size:0.8rem;color:#065f46">단원 카드를 눌러 실제 렌더된 문항을 눈으로 확인해보세요.</p></div>`;
    }
  };
</script>
</body>
</html>
