<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧩 퍼즐 풀기</title>
    <link rel="stylesheet" href="puzzle.css">
</head>
<body>

    <h1 class="page-title">🧩 퍼즐 맞추기</h1>
    <p class="page-subtitle">조각을 콕 집어서 제자리에 쏙! 넣어보자 ✨</p>

    <canvas id="puzzleCanvas" width="800" height="600"></canvas>
    <div id="message" class="message"></div>

<script src="puzzle.js"></script>
<script>
    const canvas = document.getElementById('puzzleCanvas');
    const messageEl = document.getElementById('message');

    const q = new URLSearchParams(location.search);
    const imgUrl = q.get('img');
    const cols = Math.min(15, Math.max(2, parseInt(q.get('cols')) || 4));
    const rows = Math.min(15, Math.max(2, parseInt(q.get('rows')) || 4));

    if (!imgUrl) {
        messageEl.innerText = "앗! 링크가 이상해요 😢 (그림 정보가 없어요)";
    } else {
        messageEl.innerText = "그림을 가져오는 중이에요... 🎨";
        JigsawPuzzle.init({
            canvas,
            messageEl,
            imageSource: imgUrl,
            cols,
            rows,
            locked: true
        }).then(() => {
            messageEl.innerText = "";
        }).catch(() => {
            messageEl.innerText = "그림을 못 가져왔어요 😢 선생님께 링크를 다시 여쭤보세요!";
        });
    }
</script>
</body>
</html>
