<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직소 퍼즐 만들기 (선생님용)</title>
    <!-- libheif는 HEIC 파일 선택 시에만 lazy load -->
    <link rel="stylesheet" href="puzzle.css">
</head>
<body>

    <h1 class="page-title">🧩 퍼즐 만들기</h1>
    <p class="page-subtitle">사진을 고르고 크기를 정해 우리 반 퍼즐을 만들어요! ✂️🎨</p>

    <div class="controls">
        <div class="row">
            <input type="file" id="imageInput" accept="image/*,.heic,.heif">
            <label>가로: <input type="number" id="colsInput" value="4" min="2" max="15"></label>
            <label>세로: <input type="number" id="rowsInput" value="4" min="2" max="15"></label>
            <button id="startBtn">퍼즐 만들기</button>
        </div>
        <div class="row">
            <input type="url" id="studyUrlInput" placeholder="학생에게 낼 공개 이미지 URL (https://...)">
            <button id="makeLinkBtn" class="secondary">학습용 링크 만들기</button>
        </div>
        <div class="row link-output" id="linkOutput">
            <input type="text" id="studyLink" readonly>
            <button id="copyBtn" class="secondary">복사</button>
        </div>
    </div>

    <canvas id="puzzleCanvas" width="800" height="600"></canvas>
    <div id="message" class="message"></div>

<script src="puzzle.js"></script>
<script>
    const imageInput = document.getElementById('imageInput');
    const startBtn = document.getElementById('startBtn');
    const colsInput = document.getElementById('colsInput');
    const rowsInput = document.getElementById('rowsInput');
    const messageEl = document.getElementById('message');
    const canvas = document.getElementById('puzzleCanvas');

    const studyUrlInput = document.getElementById('studyUrlInput');
    const makeLinkBtn = document.getElementById('makeLinkBtn');
    const linkOutput = document.getElementById('linkOutput');
    const studyLink = document.getElementById('studyLink');
    const copyBtn = document.getElementById('copyBtn');

    let uploadedSrc = null; // 업로드/변환된 이미지 dataURL

    // ---------------- HEIC / 파일 업로드 (maker 전용) ----------------
    let heifDecoder = null;

    function loadLibHeif() {
        return new Promise((resolve, reject) => {
            if (window.libheif) { resolve(); return; }
            const s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/libheif-js@1.18.2/libheif-wasm/libheif-bundle.js';
            s.onload = resolve;
            s.onerror = () => reject(new Error('libheif 스크립트 로드 실패'));
            document.head.appendChild(s);
        });
    }

    async function getHeifDecoder() {
        if (heifDecoder) return heifDecoder;
        await loadLibHeif();
        const lib = await libheif();
        heifDecoder = new lib.HeifDecoder();
        return heifDecoder;
    }

    // HEIF/HEIC 파일을 최신 libheif로 디코딩 → JPEG dataURL 반환
    async function convertHeif(file) {
        const decoder = await getHeifDecoder();
        const buffer = await file.arrayBuffer();
        const data = decoder.decode(new Uint8Array(buffer));

        if (!data || data.length === 0) {
            throw new Error("디코딩 결과가 비어 있습니다 (지원하지 않는 HEIF 구조)");
        }

        const image = data[0];
        const w = image.get_width();
        const h = image.get_height();

        const tmpCanvas = document.createElement('canvas');
        tmpCanvas.width = w;
        tmpCanvas.height = h;
        const tmpCtx = tmpCanvas.getContext('2d');
        const imageData = tmpCtx.createImageData(w, h);

        await new Promise((resolve, reject) => {
            image.display(imageData, (displayData) => {
                if (!displayData) {
                    reject(new Error("픽셀 디스플레이 데이터를 가져오지 못했습니다"));
                    return;
                }
                resolve();
            });
        });

        tmpCtx.putImageData(imageData, 0, 0);
        return tmpCanvas.toDataURL("image/jpeg", 0.85);
    }

    imageInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const fileName = file.name.toLowerCase();

        if (fileName.endsWith('.heic') || fileName.endsWith('.heif')) {
            messageEl.innerHTML = "아이폰(HEIF) 이미지 변환 중... 잠시만요! ⏳<br><span style='font-size:0.9rem; color:#666;'>(용량이 크면 수십 초가 걸릴 수 있습니다)</span>";
            startBtn.disabled = true;
            try {
                uploadedSrc = await convertHeif(file);
                messageEl.innerText = "변환 완료! 퍼즐 만들기를 눌러주세요.";
            } catch (error) {
                console.error("🔥 libheif 변환 에러 🔥", error);
                let errorDetail = error.message || error.toString() || JSON.stringify(error);
                let errorHtml = `HEIF 변환 실패 😢<br><br><b>[에러 내용]</b><br><span style='color: #d32f2f; font-size: 0.9rem;'>${errorDetail}</span><br><br>`;
                if (window.location.protocol === 'file:') {
                    errorHtml += `💡 <b>로컬 환경(file://) 감지됨:</b><br>웹 서버를 통해 열어야 합니다.`;
                } else if (file.size > 5 * 1024 * 1024) {
                    errorHtml += `💡 <b>대용량 파일 감지됨:</b><br>파일 용량이 5MB 이상이라 메모리 부족으로 변환에 실패했을 수 있습니다.`;
                }
                messageEl.innerHTML = errorHtml;
                startBtn.disabled = false;
                return;
            }
            startBtn.disabled = false;
        } else {
            messageEl.innerText = "";
            const reader = new FileReader();
            reader.onload = (event) => { uploadedSrc = event.target.result; };
            reader.onerror = () => { messageEl.innerText = "파일을 읽는 중 에러가 발생했습니다."; };
            reader.readAsDataURL(file);
        }
    });

    // ---------------- 퍼즐 생성 (로컬 플레이) ----------------
    startBtn.addEventListener('click', () => {
        const urlVal = studyUrlInput.value.trim();
        const source = uploadedSrc || urlVal;
        if (!source) {
            alert("이미지를 업로드하거나 공개 이미지 URL을 입력해주세요!");
            return;
        }
        messageEl.innerText = "";
        JigsawPuzzle.init({
            canvas,
            messageEl,
            imageSource: source,
            cols: colsInput.value,
            rows: rowsInput.value
        }).catch(() => { messageEl.innerText = "이미지를 불러올 수 없습니다."; });
    });

    // ---------------- 학습용 링크 생성 ----------------
    makeLinkBtn.addEventListener('click', () => {
        const imgUrl = studyUrlInput.value.trim();
        if (!imgUrl) {
            alert("학생에게 낼 공개 이미지 URL을 입력해주세요.\n(업로드한 파일은 링크로 공유할 수 없어 공개 URL이 필요합니다.)");
            return;
        }
        const cols = Math.min(15, Math.max(2, parseInt(colsInput.value) || 4));
        const rows = Math.min(15, Math.max(2, parseInt(rowsInput.value) || 4));
        const base = location.origin + location.pathname.replace(/jigsaw-puzzle\.html$/, 'study.html');
        const url = base + '?img=' + encodeURIComponent(imgUrl) + '&cols=' + cols + '&rows=' + rows;
        studyLink.value = url;
        linkOutput.classList.add('show');
        // 선생님이 이미지가 잘 뜨는지 바로 확인할 수 있게 미리보기 생성
        JigsawPuzzle.init({ canvas, messageEl, imageSource: imgUrl, cols, rows })
            .catch(() => { messageEl.innerText = "⚠️ 이미지 URL을 불러올 수 없습니다. 주소를 확인해주세요."; });
    });

    copyBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(studyLink.value);
            copyBtn.innerText = "복사됨!";
            setTimeout(() => { copyBtn.innerText = "복사"; }, 1500);
        } catch (e) {
            studyLink.select();
            document.execCommand('copy');
        }
    });
</script>
</body>
</html>
